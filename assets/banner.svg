    <radialGradient id="glow"><stop stop-color="#38D9FF" stop-opacity=".45"/><stop offset="1" stop-color="#38D9FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58A6FF" stop-opacity="0"/><stop offset=".5" stop-color="#58A6FF"/><stop offset="1" stop-color="#39D9FF" stop-opacity="0"/></linearGradient>
